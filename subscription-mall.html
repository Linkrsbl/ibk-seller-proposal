<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IBK 구독몰 제휴 제안</title>
    <link rel="stylesheet" href="subscription-mall.css?v=3">
</head>

<body>
    <main class="deck" aria-label="IBK 구독몰 제휴 제안 슬라이드">
        <section class="slide-shell active" id="slide-1" aria-label="1. 표지">
            <img class="slide-image" src="proposal-slides/output/01-cover.png" alt="반복되는 지출을 더 잘 보고 더 잘 쓰도록">
        </section>

        <section class="slide-shell" id="slide-2" aria-label="2. IBK 구독몰 소개">
            <img class="slide-image" src="proposal-slides/output/04-commerce.png" alt="IBK 구독몰은 정기지출 관리와 생활 소비를 연결하는 커머스몰입니다">
        </section>

        <section class="slide-shell" id="slide-3" aria-label="3. 시장 분석">
            <img class="slide-image" src="proposal-slides/output/03-market.png" alt="카드 앱 쇼핑몰은 모바일 쇼핑 성장과 금융 앱 접점이 만나는 시장입니다">
        </section>

        <section class="slide-shell" id="slide-4" aria-label="4. 데이터 추천 구조">
            <img class="slide-image" src="proposal-slides/output/03-data-flow.png" alt="생활 지출 데이터가 상품 추천과 구매로 연결됩니다">
        </section>

        <section class="slide-shell" id="slide-5" aria-label="5. 적합 카테고리">
            <img class="slide-image" src="proposal-slides/output/04-categories.png" alt="반복 소비와 생활 밀착성이 높은 상품일수록 잘 맞습니다">
        </section>

        <section class="slide-shell" id="slide-6" aria-label="6. 입점 절차 안내">
            <img class="slide-image" src="proposal-slides/output/05-onboarding.png" alt="입점 절차는 신청부터 판매 시작까지 단순하게 이어집니다">
        </section>

        <section class="slide-shell" id="slide-7" aria-label="7. 입점 제휴 가치">
            <img class="slide-image" src="proposal-slides/output/05-partner-value.png" alt="판매자가 부담 없이 시작하고 안정적으로 운영할 수 있는 입점 구조">
        </section>

        <section class="slide-shell" id="slide-8" aria-label="8. 제휴 문의">
            <div class="slide-composite">
                <img class="slide-image" src="proposal-slides/output/06-contact.png" alt="IBK 구독몰 입점 파트너 제휴 문의">
                <div class="contact-copy" aria-label="제휴 문의 담당자">
                    <span>Partnership Contact</span>
                    <strong>이상빈 PO</strong>
                    <div class="contact-email">
                        <small>이메일</small>
                        <span>sangbin.lee@whatssub.co</span>
                    </div>
                </div>
                <a class="apply-hotspot" href="index.html" aria-label="입점 신청하기">입점 신청하기</a>
            </div>
        </section>
    </main>

    <nav class="deck-nav" aria-label="슬라이드 이동">
        <button class="deck-nav-button" type="button" data-direction="prev" aria-label="이전 슬라이드로 이동">↑</button>
        <button class="deck-nav-button" type="button" data-direction="next" aria-label="다음 슬라이드로 이동">↓</button>
    </nav>

    <script src="subscription-mall.js"></script>
</body>

</html>
