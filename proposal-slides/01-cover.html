<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IBK 구독몰 제휴 제안 표지</title>
    <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            font-family: 'Pretendard Variable', Pretendard, system-ui, -apple-system, sans-serif;
            background: #ffffff;
        }

        .cover {
            position: relative;
            width: 1920px;
            height: 1080px;
            overflow: hidden;
            background-image:
                linear-gradient(90deg, rgba(255, 255, 255, 0.98) 0%, rgba(255, 255, 255, 0.92) 30%, rgba(255, 255, 255, 0.28) 56%, rgba(255, 255, 255, 0.02) 100%),
                url("assets/proposal-cover-bg.png");
            background-size: cover;
            background-position: center center;
        }

        .copy {
            position: absolute;
            left: 124px;
            top: 116px;
            width: 740px;
            color: #000000;
        }

        h1 {
            margin: 0;
            font-size: 76px;
            line-height: 1.15;
            font-weight: 950;
            letter-spacing: 0;
            word-break: keep-all;
        }

        .subtitle {
            margin: 134px 0 0;
            color: #000000;
            font-size: 34px;
            line-height: 1.58;
            font-weight: 850;
            letter-spacing: 0;
            word-break: keep-all;
        }

        .date {
            position: absolute;
            left: 124px;
            bottom: 126px;
            margin: 0;
            color: #000000;
            font-size: 28px;
            line-height: 1;
            font-weight: 850;
            letter-spacing: 0;
        }

        .logo {
            position: absolute;
            right: 124px;
            bottom: 106px;
            width: 128px;
            height: auto;
        }
    </style>
</head>

<body>
    <main class="cover" aria-label="IBK 구독몰 제휴 제안 표지">
        <section class="copy">
            <h1>반복되는 지출을<br>더 잘 보고<br>더 잘 쓰도록</h1>
            <p class="subtitle">정기지출 관리부터 구독 상품 이용까지,<br>IBK기업은행 카드 앱 안에서 이어지는 생활밀착형 서비스</p>
        </section>
        <p class="date">2026.04</p>
        <img class="logo" src="assets/whatsub-logo.png" alt="왓섭 로고">
    </main>
</body>

</html>
