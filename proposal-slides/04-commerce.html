<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>생활밀착형 커머스몰 슬라이드</title>
    <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            font-family: 'Pretendard Variable', Pretendard, system-ui, -apple-system, sans-serif;
            background: #ffffff;
        }

        .slide {
            position: relative;
            width: 1920px;
            height: 1080px;
            overflow: hidden;
            background-image:
                linear-gradient(180deg, rgba(255,255,255,0.98) 0%, rgba(255,255,255,0.94) 22%, rgba(255,255,255,0.52) 40%, rgba(255,255,255,0.02) 66%),
                url("assets/proposal-slide-04-bg.png");
            background-size: cover;
            background-position: center center;
        }

        .copy {
            position: absolute;
            left: 96px;
            top: 72px;
            width: 1680px;
            padding-left: 28px;
            border-left: 8px solid #5A6DFF;
        }

        h1 {
            margin: 0;
            color: #000000;
            font-size: 60px;
            line-height: 1.16;
            font-weight: 950;
            letter-spacing: 0;
            word-break: keep-all;
        }

        h1 strong {
            color: #4F63FF;
            font-weight: 950;
        }

        p {
            margin: 24px 0 0;
            color: #3B4656;
            font-size: 32px;
            line-height: 1.44;
            font-weight: 850;
            letter-spacing: 0;
            word-break: keep-all;
        }

        p strong {
            color: #4F63FF;
            font-weight: 950;
        }
    </style>
</head>

<body>
    <main class="slide" aria-label="생활밀착형 커머스몰 슬라이드">
        <section class="copy">
            <h1>IBK 구독몰은 정기지출 관리와 <strong>생활 소비</strong>를 연결하는 커머스몰입니다</h1>
            <p>고객이 매달 확인하는 반복 지출을 기반으로, 구독, 쇼핑, 여행, 쿠폰, 생활용품까지 <strong>필요한 상품과 혜택을 IBK 카드 앱 안에서 제안</strong>합니다.</p>
        </section>
    </main>
</body>

</html>
